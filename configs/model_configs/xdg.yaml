model:
  type: src.models.vit_classifier
  num_classes: 2
  symmetrical: true
  return_symmetrical_logits: false
  input_normalize:
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  backbone:
    model_path: depth-anything/da3-base
    model_name: da3-base
    freeze: true
    img_size: 560
    lora:
      enabled: true
      rank: 8
      alpha: 16.0
      dropout: 0.05
      train_camera_token: true
      target_modules: [qkv, proj, fc1, fc2]
  classifier:
    type: camera_token
    enc_dim: 1536
    dec_dim: 768
    hidden_dim: 768
    dec_dropout: 0.1
    sym_agg_hidden_ratio: 4.0
    num_stages: 4
    pool: mean

inference:
  dataset_type: src.datasets.pairwise_disambiguation_dataset
  img_size: [560, 560]
  mode: resize
  batch_size: 16
  num_workers: 8
  matmul_precision: high
